name: Verify T1 SDK probe
on:
  push:
    branches: [qa/t1-sdk-probe-20261121]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1e0a495e0d8734ab18c47cd3fdd8186949c250cf
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify iframe selection and failure outcomes in Chromium
        env:
          CHROME: /usr/bin/google-chrome
        run: node tools/qa/yandex-probe-check.mjs --cdn
      - name: Check official scripts and development initialization on the production build
        env:
          CHROME: /usr/bin/google-chrome
          YANDEX_QA_CERT: work/yandex-sdk/localhost.crt
        run: |
          set -euo pipefail
          mkdir -p work/qa-out
          curl -fsS --max-time 30 https://games.s3.yandex.net/sdk.js -o work/sdk.js
          sha256sum work/sdk.js
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const s = readFileSync('work/sdk.js','utf8');
          console.log({length:s.length, productionSignature:s.includes('YandexGamesSDK'), mentions: s.match(/.{0,40}\/sdk\/_\/v2\..{0,50}/g)?.slice(0,2)});
          JS
          npm install --prefix work/yandex-sdk --no-save @yandex-games/sdk-dev-proxy@0.0.2
          node --use-env-proxy tools/qa/yandex-dev-server.cjs > work/official-proxy.log 2>&1 &
          sdk_pid=$!
          trap 'kill "$sdk_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if test -f "$YANDEX_QA_CERT" && curl -fsS --cacert "$YANDEX_QA_CERT" https://localhost:8080/ -o /dev/null; then break; fi
            sleep 1
          done
          node --import tsx tools/qa/yandex-live.ts https://localhost:8080/ work/qa-out/yandex-init.json
          cmp qa/t1-sdk/yandex-init.json work/qa-out/yandex-init.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1-sdk-initialization-1e0a495
          path: work/qa-out/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: guild-of-shadows-t1-1e0a495
          path: dist/
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: guild-of-shadows-t1-1e0a495
          path: work/upload-readback
      - name: Check the downloadable archive against the built game
        run: |
          set -euo pipefail
          test -s work/upload-readback/index.html
          diff -qr dist work/upload-readback
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          root = Path('work/upload-readback')
          class CheckEntrypoints(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if (tag, name) in {('script', 'src'), ('link', 'href')} and not value.startswith('data:'):
                          assert (root / value).is_file(), value
          CheckEntrypoints().feed((root / 'index.html').read_text())
          print('Archive read back with index.html at root and', sum(p.is_file() for p in root.rglob('*')), 'files')
          PY
