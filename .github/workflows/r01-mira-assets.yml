name: R-01 Mira export reproduction

on:
  push:
    branches: [integration/r01-rehearsal]
    paths:
      - .github/workflows/r01-mira-assets.yml
      - tools/release/r01-mira-compare.py
      - tools/art/build_poses.py
      - art-sources/poses/mira/proposals/**
      - public/art/v17/heroes/mira/poses/**

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow with the bundled WebP codec
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'Pillow==11.3.0'
      - name: Rebuild and compare all nine files
        run: python tools/release/r01-mira-compare.py "$RUNNER_TEMP/r01-mira"
      - name: Archive source and output hashes and pixel comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mira-export-${{ github.sha }}
          path: ${{ runner.temp }}/r01-mira/report.json
          if-no-files-found: error
          retention-days: 14
