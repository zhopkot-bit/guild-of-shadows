name: R01 art rehearsal

on:
  push:
    branches: [integration/r01-rehearsal]

permissions:
  contents: read

jobs:
  art:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        backend: [webgl, canvas2d]
        viewport:
          - { width: 1920, height: 1080 }
          - { width: 667, height: 375 }
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: tested
          ref: 8307ef7910f3bd80fc05a51939a034aa8bd3fbd2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tested/package-lock.json
      - name: Install test dependencies and Chromium
        working-directory: tested
        run: |
          npm ci
          node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Prepare documented battle fixtures
        working-directory: tested
        run: |
          QA_PARTY=mira,rook,nora node --import tsx tools/qa/make-saves.ts qa-saves/mira
          node --import tsx tools/qa/pose-set-saves.ts qa-saves/mira qa-saves/pose-sets
      - name: Inspect poses and follow a live boss battle
        working-directory: tested
        run: node ../harness/tools/release/r01-art-check.mjs ${{ matrix.backend }} ${{ matrix.viewport.width }} ${{ matrix.viewport.height }}
      - name: Preserve screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u01-${{ matrix.backend }}-${{ matrix.viewport.width }}x${{ matrix.viewport.height }}-${{ github.sha }}
          path: tested/qa-out/u01/
          if-no-files-found: warn
          retention-days: 14
