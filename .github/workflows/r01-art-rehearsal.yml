name: R01 art rehearsal

on:
  push:
    branches: [integration/r01-rehearsal]

permissions:
  contents: read

jobs:
  art:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        backend: [webgl, canvas2d]
        viewport:
          - { width: 1920, height: 1080 }
          - { width: 667, height: 375 }
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: tested
          ref: 8307ef7910f3bd80fc05a51939a034aa8bd3fbd2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tested/package-lock.json
      - name: Install test dependencies and Chromium
        working-directory: tested
        run: |
          npm ci
          node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Prepare documented battle fixtures
        working-directory: tested
        run: |
          QA_PARTY=mira,rook,nora node --import tsx tools/qa/make-saves.ts qa-saves/mira
          node --import tsx tools/qa/pose-set-saves.ts qa-saves/mira qa-saves/pose-sets
      - name: Capture the historical mobile HUD before applying the candidate fixes
        if: matrix.viewport.width == 667
        working-directory: tested
        run: node ../harness/tools/release/r01-art-check.mjs ${{ matrix.backend }} ${{ matrix.viewport.width }} ${{ matrix.viewport.height }} --baseline-preview
      - name: Apply and identify the candidate fixes
        working-directory: tested
        shell: bash
        run: |
          set -euo pipefail
          patch_dir="$GITHUB_WORKSPACE/harness/tools/release/rehearsal"
          patches=("$patch_dir/boss-hud.patch" "$patch_dir/boss-phase.patch" "$patch_dir/canvas-emissive.patch")
          sha256sum "${patches[@]}"
          git apply --check "${patches[@]}"
          git apply --index "${patches[@]}"
          git diff --cached --check
          git write-tree
      - name: Verify the patched game and production registry
        if: matrix.backend == 'webgl' && matrix.viewport.width == 667
        working-directory: tested
        run: |
          npm test
          npm run build
          node tools/art/validate_pack.mjs dist/art/v17/art-pack.json --strict
      - name: Inspect poses and follow a live boss battle
        working-directory: tested
        run: node ../harness/tools/release/r01-art-check.mjs ${{ matrix.backend }} ${{ matrix.viewport.width }} ${{ matrix.viewport.height }}
      - name: Preserve screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u01-${{ matrix.backend }}-${{ matrix.viewport.width }}x${{ matrix.viewport.height }}-${{ github.sha }}
          path: tested/qa-out/u01/
          if-no-files-found: warn
          retention-days: 14

  integrated-art:
    name: Integrated artwork (${{ matrix.backend }}, ${{ matrix.viewport.width }}×${{ matrix.viewport.height }})
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        backend: [webgl, canvas2d]
        viewport:
          - { width: 1920, height: 1080 }
          - { width: 667, height: 375 }
    env:
      ART_SHA: 6bcf4f95fd8beff9d94f79101513404b4955ec57
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce the integrated game with a native Git three-way merge
        if: matrix.backend == 'webgl' && matrix.viewport.width == 667
        env:
          MAIN_SHA: 17d707071767b24e963a0014b2721a330bbec544
          INTEGRATION_SHA: 142867071524ef0af4212033f79325bf07fe834a
          ART_TREE: 4f4a8ea33a65f1f0da396fd17070df9196009b63
          BRAN_SHA: d678d6e3532b9955377f52ebc0f5901d65d2ce42
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$INTEGRATION_SHA" HEAD
          test "$(git merge-tree --write-tree "$MAIN_SHA" "$ART_SHA")" = "$ART_TREE"
          export GIT_INDEX_FILE="$RUNNER_TEMP/expected-game.index"
          git read-tree "$INTEGRATION_SHA"
          git diff --binary --full-index --no-renames "$MAIN_SHA" "$ART_TREE" -- public/art/v17 src tests/arena-layout.test.ts > "$RUNNER_TEMP/verified-art.patch"
          git apply --3way --cached "$RUNNER_TEMP/verified-art.patch"
          git restore --source="$BRAN_SHA" --staged -- public/art/v17/poses/bran
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const registry = 'public/art/v17/art-pack.json';
          const read = ref => JSON.parse(execFileSync('git', ['show', ref + ':' + registry], { encoding: 'utf8' }));
          const expected = read('');
          assert.equal(expected.heroes.bran, undefined);
          expected.heroes.bran = { poses: 'poses/bran/poses.json' };
          assert.deepEqual(read('HEAD'), expected);
          JS
          git restore --source=HEAD --staged -- public/art/v17/art-pack.json
          expected_tree=$(git write-tree)
          git diff --exit-code "$expected_tree" HEAD -- public/art/v17 src tests/arena-layout.test.ts
          for p in src/ui/arena/scene.ts src/ui/battleView.ts src/ui/style.css; do
            printf '%s %s\n' "$(git rev-parse "HEAD:$p")" "$p"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies and Chromium
        run: |
          npm ci
          node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Prepare battle fixtures using the current game
        run: |
          set -euo pipefail
          git diff --exit-code "$ART_SHA" HEAD -- tools/qa/pose-set-saves.ts tools/qa/approved-pose-integration.mjs art-sources/poses/technical-layout.json
          QA_PARTY=mira,rook,nora node --import tsx tools/qa/make-saves.ts qa-saves/mira
          node --import tsx tools/qa/pose-set-saves.ts qa-saves/mira qa-saves/pose-sets
      - name: Inspect poses, HUD and boss phases on this integration commit
        run: node tools/release/r01-art-check.mjs ${{ matrix.backend }} ${{ matrix.viewport.width }} ${{ matrix.viewport.height }} --integration
      - name: Preserve integrated screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-art-${{ matrix.backend }}-${{ matrix.viewport.width }}x${{ matrix.viewport.height }}-${{ github.sha }}
          path: qa-out/u01/candidate/
          if-no-files-found: warn
          retention-days: 14
