name: Bran v0.5 quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node tools/art/validate_pack.mjs public/art/v17/art-pack.json --strict
  bran-art-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/qa/bran-v05-gate.mjs . docs/qa/bran-v05-contract.json --strict
